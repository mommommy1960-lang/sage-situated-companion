<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commons Live Ensemble Android V3</title><style>body{margin:0;background:#080b11;color:#f7f8fb;font-family:system-ui}main{max-width:900px;margin:auto;padding:18px}.card{background:#111925;border:1px solid #2c394d;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:9px;flex-wrap:wrap}input{flex:1;min-width:200px;background:#090e16;color:#fff;border:1px solid #3b4a60;border-radius:12px;padding:13px;font-size:17px}button{border:0;border-radius:13px;padding:13px 16px;font-weight:800;font-size:16px}.go{background:#e8c66d}.stop{background:#702934;color:#fff}.status,.feed{background:#090e16;border-radius:12px;padding:12px;margin-top:12px}.ok{color:#86e7a3}.bad{color:#ff929e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#090e16;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:8px;border-bottom:1px solid #1d2938}.who{color:#e8c66d;font-weight:800}</style></head><body><main><h1>👑 Commons Live Ensemble</h1><div>Android LIVE co-host • V3</div><section class="card"><div class="row"><input id="u" value="user2885077566"><button id="start" class="go">▶ CONNECT LIVE</button><button id="stop" class="stop" style="display:none">■ STOP</button></div><div id="status" class="status">Start TikTok LIVE first, then tap CONNECT LIVE.</div><div class="stats"><div class="stat"><b id="viewers">0</b>watching</div><div class="stat"><b id="likes">0</b>likes</div><div class="stat"><b id="diamonds">0</b>diamonds</div></div></section><section class="card"><h3>🔊 Spoken LIVE</h3><div class="switches"><label><input id="join" type="checkbox" checked> Welcome joins</label><label><input id="chat" type="checkbox" checked> Read comments</label><label><input id="gift" type="checkbox" checked> Announce Gifts</label><label><input id="like" type="checkbox" checked> React to Likes</label></div><p><button id="voice">🔊 TEST VOICE</button></p></section><section class="card"><h3>Live feed</h3><div id="feed" class="feed">Waiting for events…</div></section></main><script>const KEY='your_api_key',WS='wss://api.tik.tools';let ws=null,L=0,D=0,V=0,joins=new Set(),gifts=new Set();const $=x=>document.getElementById(x);function st(t,c=''){let e=$('status');e.textContent=t;e.className='status '+c}function sp(t){if('speechSynthesis'in window){let x=new SpeechSynthesisUtterance(t);x.rate=.96;speechSynthesis.speak(x)}}function name(d){return d?.user?.nickname||d?.user?.uniqueId||'friend'}function feed(user,text){let f=$('feed');if(f.textContent==='Waiting for events…')f.innerHTML='';let d=document.createElement('div');d.className='item';d.innerHTML='<span class="who">'+user+'</span> '+text;f.appendChild(d);f.scrollTop=f.scrollHeight}function handle(m){let e=m?.event||m?.type,d=m?.data||m||{};if(!e)return;if(e==='roomInfo'){st('LIVE CONNECTED ✅','ok');return}if(e==='roomUserSeq'){V=+d.viewerCount||0;$('viewers').textContent=V;return}if(e==='member'){let n=name(d);if(joins.has(n))return;joins.add(n);feed(n,'joined');if($('join').checked)sp('Welcome in, '+n+'. You have entered the Lounge.');return}if(e==='chat'){let n=name(d),c=d.comment||'';feed(n,'said: '+c);if($('chat').checked)sp(n+' says, '+c);return}if(e==='like'){let n=name(d),c=+d.likeCount||1;L=+d.totalLikes||L+c;$('likes').textContent=L;feed(n,'liked ×'+c+' • total '+L);if($('like').checked&&L<50)sp(n+' liked the LIVE. Thank you, '+n+'.');return}if(e==='gift'){if(d.repeatEnd===false)return;let n=name(d),g=d.giftName||'Gift',r=+d.repeatCount||1,id=d.transactionId||n+g+r+Date.now();if(gifts.has(id))return;gifts.add(id);let val=(+d.diamondCount||0)*r;D+=val;$('diamonds').textContent=D;feed(n,'sent '+g+' ×'+r);if($('gift').checked)sp(n+' sent '+g+'. Thank you, '+n+'.');return}if(e==='social'){let n=name(d),a=d.action||'';feed(n,a);if(a.includes('follow'))sp(n+' followed. Welcome to the community.');if(a.includes('share'))sp(n+' shared the LIVE. Thank you.')}}function connect(){let u=$('u').value.trim().replace(/^@/,'');if(!u)return st('Enter your TikTok username.','bad');st('CONNECTING…');try{ws=new WebSocket(WS+'?uniqueId='+encodeURIComponent(u)+'&apiKey='+encodeURIComponent(KEY))}catch(e){return st('Could not create connection.','bad')}ws.onopen=()=>st('DATA SERVICE CONNECTED ✅\nWaiting for TikTok room…','ok');ws.onmessage=x=>{try{let p=JSON.parse(x.data);if(Array.isArray(p))p.forEach(handle);else if(Array.isArray(p.messages))p.messages.forEach(handle);else handle(p);$('start').style.display='none';$('stop').style.display=''}catch(e){}};ws.onerror=()=>st('LIVE DATA CONNECTION ERROR','bad');ws.onclose=()=>{st('Disconnected. Tap CONNECT LIVE to reconnect.','bad');$('start').style.display='';$('stop').style.display='none'}}$('start').onclick=connect;$('stop').onclick=()=>{if(ws)ws.close();ws=null};$('voice').onclick=()=>sp('Voice test successful. Sage is awake.');document.body.addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.resume()},{once:true});</script></body></html>
