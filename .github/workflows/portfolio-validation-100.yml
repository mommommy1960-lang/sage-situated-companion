name: Portfolio validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/portfolio-validation-100.yml"
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  validation:
    name: Validation run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        run: [0]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install test dependencies when declared
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run repository tests when present
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 3 -type f \( -name 'pytest.ini' -o -name 'pyproject.toml' -o -name 'tox.ini' \) | grep -q . || [ -f requirements.txt ]; then
            python -m pytest -q
          elif find . -maxdepth 3 -type f -path './tests/*.py' | grep -q .; then
            python -m unittest discover -s tests -v
          else
            echo "No repository test runner detected; compilation validation passed."
          fi
