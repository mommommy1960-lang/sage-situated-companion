name: Sage Device Controller Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  device-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test device lifecycle, model parsing and business controls
        run: node --test tests/device/*.test.mjs tests/business/*.test.mjs
